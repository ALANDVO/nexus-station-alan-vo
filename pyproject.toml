[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-station"
version = "1.0.0"
description = "Long-term memory for agent coding CLIs and handoff between agent vendors"
authors = [{ name = "Alan Vo", email = "alanvo@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.0",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "pydantic-settings==2.6.1",
  "python-multipart==0.0.9",
  "python-jose==3.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
]

[project.urls]
Homepage = "https://github.com/ALANDVO/nexus-station-alan-vo"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]